name: Feature idea
description: Something that would make the remote better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution. "I always lose the remote when..." is a great start.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
