name: Release

# Builds a signed APK and publishes it as a GitHub release.
# Runs when a version tag is pushed (v1.2.3), or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (created on the selected branch if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version=$(grep '^lumen.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match lumen.versionName=$version in gradle.properties"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LUMEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        env:
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key; check the signing secrets."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="LumenRemote-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          # Release notes come from the matching CHANGELOG.md section.
          awk -v v="${TAG#v}" '
            $0 ~ "^## \[?"v"\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for details." > notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$TAG" "$apk" "$apk.sha256" \
              --title "Lumen Remote ${TAG#v}" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
